name: daily-quant-pipeline
on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = 北京时间 17:30（A股收盘后）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 每日流水线（抓数/因子/投票/通知 + walk-forward 寻优）
        run: python -m quant.run_daily --db data/quant.db --export data/export.json --optimize
      - name: 提交数据更新
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/quant.db data/export.json frontend/data/export.json
          git commit -m "daily run $(date -u +%F)" || echo "no changes"
          git push
